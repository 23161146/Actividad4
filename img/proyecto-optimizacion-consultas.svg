<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Comparación de tiempos de consulta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="200" fill="#FFF0ED"/>
  <g font-family="monospace" font-size="11" fill="#14141F">
    <text x="30" y="40" font-weight="bold">EXPLAIN · tiempo de consulta</text>
    <text x="30" y="80">Sin índice</text>
